<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAR RACING</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#18243b,#070b13 65%);font-family:Arial,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;padding:18px}
.wrap{width:min(100%,430px);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.brand{font-weight:900;letter-spacing:3px;font-size:23px;color:#f7faff}.stats{display:flex;gap:8px}.stat{background:#151f31;border:1px solid #293850;border-radius:12px;padding:9px 12px;font-size:12px;color:#a9bad2}.stat b{display:block;color:#fff;font-size:18px;margin-top:3px}
.game{position:relative;width:100%;height:min(70vh,620px);min-height:430px;overflow:hidden;border:3px solid #34445e;border-radius:20px;background:#252c36;box-shadow:0 18px 55px #0009}
.road{position:absolute;inset:0 12% 0;background:linear-gradient(90deg,#333b46,#202731 50%,#333b46);border-left:5px solid #e9e9e9;border-right:5px solid #e9e9e9}
.lane{position:absolute;top:-100%;height:200%;width:6px;background:repeating-linear-gradient(to bottom,#e8e8e8 0 36px,transparent 36px 72px);opacity:.8;animation:move .8s linear infinite}
.l1{left:33.3%}.l2{left:66.6%}@keyframes move{to{transform:translateY(72px)}}
.car{position:absolute;width:48px;height:82px;border-radius:13px 13px 9px 9px;background:linear-gradient(90deg,#ffb02e,#f04432);bottom:22px;left:50%;transform:translateX(-50%);z-index:3;box-shadow:inset 0 0 0 3px #7b201d,0 5px 12px #0008}
.car:before{content:"";position:absolute;left:9px;top:13px;width:30px;height:25px;background:#9de4ff;border-radius:7px 7px 3px 3px;border:2px solid #8b3026}
.car:after{content:"";position:absolute;left:5px;right:5px;bottom:9px;height:9px;background:#ffdf75;border-radius:3px}
.enemy{position:absolute;width:46px;height:76px;border-radius:12px;background:linear-gradient(90deg,#4db8ff,#1765c7);border:3px solid #133e78;z-index:2}
.enemy:before{content:"";position:absolute;left:8px;top:11px;width:24px;height:23px;background:#a6e5ff;border-radius:5px}
.overlay{position:absolute;inset:0;background:#07101dcc;display:flex;align-items:center;justify-content:center;z-index:5;padding:24px}.panel{max-width:300px}.panel h1{font-size:30px;margin:0 0 10px;letter-spacing:2px}.panel p{color:#bdc9d9;line-height:1.5}
button{border:0;border-radius:12px;background:linear-gradient(135deg,#ffb12b,#f04a35);color:#161616;font-weight:900;font-size:16px;padding:14px 24px;cursor:pointer;box-shadow:0 6px 18px #f04a3540}
.controls{display:flex;justify-content:center;gap:24px;margin-top:14px}.ctrl{width:78px;height:52px;font-size:24px;padding:0;background:#1c2b42;color:white;border:1px solid #425775;box-shadow:none}
.hint{font-size:12px;color:#9aabc2;margin-top:10px}.hide{display:none!important}
@media(max-height:650px){.game{height:62vh;min-height:360px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand">🏁 CAR RACING</div><div class="stats"><div class="stat">BALL <b id="score">0</b></div><div class="stat">REKORD <b id="best">0</b></div></div></div>
 <div class="game" id="game">
  <div class="road"><div class="lane l1"></div><div class="lane l2"></div></div>
  <div class="car" id="player"></div>
  <div class="overlay" id="overlay"><div class="panel"><h1 id="heading">CAR RACING</h1><p id="message">Mashinani boshqaring, boshqa mashinalarga urilmang va imkon qadar ko‘proq ochko to‘plang!</p><button id="start">O‘YINNI BOSHLASH</button></div></div>
 </div>
 <div class="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
 <div class="hint">Kompyuter: ← → tugmalari · Telefon: pastdagi tugmalar</div>
</div>
<script>
const game=document.getElementById('game'),player=document.getElementById('player'),overlay=document.getElementById('overlay');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let x=0,score=0,best=Number(localStorage.getItem('carRacingBest')||0),running=false,items=[],spawn=0,last=0,raf=0;
bestEl.textContent=best;
function roadBounds(){const r=game.getBoundingClientRect();return {left:r.width*.12+7,right:r.width*.88-7,width:r.width};}
function setCar(){player.style.left=x+'px';}
function reset(){items.forEach(o=>o.el.remove());items=[];score=0;scoreEl.textContent='0';const b=roadBounds();x=b.width/2;setCar();}
function move(dir){if(!running)return;const b=roadBounds();x=Math.max(b.left+25,Math.min(b.right-25,x+dir*24));setCar();}
function spawnEnemy(){const b=roadBounds(),el=document.createElement('div');el.className='enemy';const lanes=[b.width*.31,b.width*.5,b.width*.69];const ex=lanes[Math.floor(Math.random()*lanes.length)];el.style.left=(ex-23)+'px';el.style.top='-90px';game.appendChild(el);items.push({el,x:ex,y:-90});}
function endGame(){running=false;cancelAnimationFrame(raf);if(score>best){best=score;localStorage.setItem('carRacingBest',best);bestEl.textContent=best;}document.getElementById('heading').textContent='O‘YIN TUGADI';document.getElementById('message').textContent='Siz '+score+' ochko to‘pladingiz. Yana urinib ko‘ring!';document.getElementById('start').textContent='QAYTA BOSHLASH';overlay.classList.remove('hide');}
function loop(t){if(!running)return;const dt=Math.min((t-last)/16.67||1,2);last=t;spawn+=dt;if(spawn>48){spawnEnemy();spawn=0;}const py=game.clientHeight-63;
for(let i=items.length-1;i>=0;i--){const o=items[i];o.y+=4.2*dt;o.el.style.top=o.y+'px';if(o.y>game.clientHeight){o.el.remove();items.splice(i,1);score++;scoreEl.textContent=score;}else if(o.y+70>py&&o.y<py+70&&Math.abs(o.x-x)<39){endGame();return;}}
raf=requestAnimationFrame(loop);}
function start(){reset();overlay.classList.add('hide');running=true;last=performance.now();raf=requestAnimationFrame(loop);}
document.getElementById('start').addEventListener('click',start);
document.getElementById('left').addEventListener('click',()=>move(-1));document.getElementById('right').addEventListener('click',()=>move(1));
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);});
let hold=null;[['left',-1],['right',1]].forEach(([id,d])=>{const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();move(d);hold=setInterval(()=>move(d),110);},{passive:false});['touchend','touchcancel','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,()=>{clearInterval(hold);hold=null;}));});
window.addEventListener('resize',()=>{if(!running){const b=roadBounds();x=b.width/2;setCar();}});
reset();
</script>
</body>
</html>
